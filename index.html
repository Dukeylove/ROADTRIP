                    {/* Hero Header */}
                    <div className="relative pt-12 pb-8 px-6 bg-slate-900 border-b border-slate-800 shadow-2xl z-20">
                        <div className="max-w-2xl mx-auto">
                            <span className="inline-block py-1 px-3 rounded-full bg-cyan-900/30 border border-cyan-500/30 text-cyan-400 text-xs font-bold tracking-wider mb-4">
                                🌏 60 TAGE SOLO TRIP
                            </span>
                            <h1 className="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 mb-2 leading-tight">
                                DEIN ASIA<br/>ABENTEUER '26
                            </h1>
                            <p className="text-slate-400 font-light text-lg">
                                Von Cyberpunk-Städten zu einsamen Inseln. <br/>
                                <span className="text-slate-500 text-sm mt-1 block font-mono">Status: Planung steht. Vorfreude läuft.</span>
                            </p>
                        </div>
                    </div>

                    {/* Timeline Container */}
                    <div className="max-w-2xl mx-auto px-4 py-8 relative">
                        
                        {itinerary.map((item, index) => {
                            // Render CHAPTER Header
                            if (item.type === "chapter") {
                                return (
                                    <div key={index} className="relative z-10 mt-12 mb-8">
                                        <h2 className={`text-2xl font-bold handwritten ${item.color} mb-1 pl-12`}>
                                            {item.title}
                                        </h2>
                                        <p className="text-slate-400 text-sm pl-12 font-mono">{item.desc}</p>
                                    </div>
                                );
                            }

                            // Render TRANSIT Card
                            if (item.type === "transit" || item.type === "special_transit") {
                                const isSpecial = item.type === "special_transit";
                                return (
                                    <div key={index} className="relative pl-12 mb-8 group">
                                        {/* Connector Line Logic handled by CSS generally, but visual cue here */}
                                        <div className="absolute left-[21px] top-0 bottom-0 w-0.5 bg-slate-800 -z-10"></div>
                                        
                                        <div className={`absolute left-3 top-0 w-8 h-8 rounded-full flex items-center justify-center border-2 z-10 bg-slate-900 ${isSpecial ? 'border-yellow-400 text-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.3)]' : 'border-slate-700 text-slate-500'}`}>
                                            {item.icon}
                                        </div>

                                        <div className={`p-4 rounded-xl border ${isSpecial ? 'bg-yellow-900/10 border-yellow-500/30' : 'bg-slate-900/50 border-slate-800'} backdrop-blur-sm`}>
                                            {isSpecial && <div className="text-xs font-bold text-yellow-400 mb-1 uppercase tracking-widest">✨ {item.title}</div>}
                                            <div className="flex items-center justify-between mb-2">
                                                <h3 className="font-bold text-slate-200 text-sm">{item.route}</h3>
                                                <span className="text-xs text-slate-500 font-mono bg-slate-900 px-2 py-1 rounded">{item.duration || item.dates}</span>
                                            </div>
                                            
                                            {/* Transport Method Badge */}
                                            <div className="inline-flex items-center gap-1.5 px-2 py-1 rounded bg-slate-800 text-slate-400 text-xs mb-3">
                                                {item.icon}
                                                <span>{item.method}</span>
                                            </div>

                                            {item.why && (
                                                <p className="text-sm text-yellow-200/80 mb-2 italic">"{item.why}"</p>
                                            )}
                                            
                                            <div className="flex gap-2 items-start text-xs text-slate-400 bg-slate-950/50 p-2 rounded">
                                                <span className="mt-0.5 text-cyan-500">💡</span>
                                                <span>{item.tip}</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            }

                            // Render STOP (City) Card
                            return (
                                <div key={index} className="relative pl-12 mb-12">
                                    {/* Vertical Line */}
                                    <div className="absolute left-[24px] -top-8 bottom-0 w-0.5 bg-slate-800 -z-10"></div>
                                    
                                    {/* Dot */}
                                    <div className="absolute left-[16px] top-6 w-4 h-4 rounded-full bg-cyan-500 border-4 border-slate-900 shadow-[0_0_10px_rgba(6,182,212,0.5)] z-10"></div>

                                    {/* Main Card */}
                                    <div className="glass-card rounded-2xl p-0 overflow-hidden shadow-lg hover:border-cyan-500/30 transition-all duration-300">
                                        
                                        {/* Header */}
                                        <div className="p-5 bg-gradient-to-r from-slate-800/50 to-slate-900/50 border-b border-slate-700/50">
                                            <div className="flex justify-between items-start mb-1">
                                                <h3 className="text-xl font-bold text-white tracking-tight">{item.city}</h3>
                                                <span className="text-xs font-bold bg-cyan-900/50 text-cyan-300 px-2 py-1 rounded border border-cyan-800">{item.days}</span>
                                            </div>
                                            <div className="flex items-center gap-2 text-sm text-slate-400 font-mono mb-3">
                                                <span>{item.country}</span>
                                                <span className="text-slate-600">•</span>
                                                <span>{item.dates}</span>
                                            </div>
                                            <div className="inline-block px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs text-slate-300 italic">
                                                ✨ Vibe: {item.vibe}
                                            </div>
                                        </div>

                                        {/* Body */}
                                        <div className="p-5 space-y-5">
                                            
                                            {/* WHY Section */}
                                            <div className="relative pl-4 border-l-2 border-purple-500/30">
                                                <p className="text-sm text-slate-300 italic leading-relaxed">
                                                    "{item.why}"
                                                </p>
                                            </div>

                                            {/* To-Dos */}
                                            <div>
                                                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 flex items-center gap-2">
                                                    <Camera size={14}/> Must Do's
                                                </h4>
                                                <div className="space-y-2">
                                                    {item.toDo.map((todo, i) => {
                                                        const key = item.city + i;
                                                        const isChecked = checkedItems[key];
                                                        return (
                                                            <div 
                                                                key={i} 
                                                                className="flex items-center justify-between gap-2 group"
                                                            >
                                                                <div 
                                                                    onClick={() => toggleCheck(key)}
                                                                    className={`flex-1 flex items-start gap-3 p-2 rounded cursor-pointer transition-colors ${isChecked ? 'bg-green-900/10' : 'hover:bg-slate-800/50'}`}
                                                                >
                                                                    <div className={`mt-1 w-4 h-4 rounded border flex items-center justify-center shrink-0 transition-colors ${isChecked ? 'bg-green-500 border-green-500' : 'border-slate-600'}`}>
                                                                        {isChecked && <CheckCircle size={12} className="text-white" />}
                                                                    </div>
                                                                    <div>
                                                                        <div className={`text-sm font-medium ${isChecked ? 'text-slate-500 line-through' : 'text-slate-200'}`}>{todo.title}</div>
                                                                        <div className="text-xs text-slate-500 mt-0.5">{todo.note}</div>
                                                                    </div>
                                                                </div>
                                                                <a 
                                                                    href={getMapsUrl(todo.title, item.city)}
                                                                    target="_blank"
                                                                    rel="noopener noreferrer"
                                                                    className="p-2 text-slate-600 hover:text-cyan-400 transition-colors opacity-50 hover:opacity-100"
                                                                    title="Auf Karte zeigen"
                                                                >
                                                                    <MapPin size={16} />
                                                                </a>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>

                                            {/* Hidden Gems Section (Collapsible) */}
                                            {item.hiddenGems && (
                                                <div className="mt-4 pt-4 border-t border-slate-800/50">
                                                    <button 
                                                        onClick={() => toggleGems(index)}
                                                        className="w-full flex items-center justify-between group p-1 -ml-1 rounded hover:bg-slate-800/30 transition-colors"
                                                    >
                                                        <h4 className="text-xs font-bold text-cyan-400 uppercase tracking-widest flex items-center gap-2 group-hover:text-cyan-300">
                                                            <Gem size={14}/> Insider & Hipster Gems
                                                        </h4>
                                                        <div className="text-cyan-400 group-hover:text-cyan-300">
                                                            {expandedGems[index] ? <ChevronUp size={16}/> : <ChevronDown size={16}/>}
                                                        </div>
                                                    </button>
                                                    
                                                    {expandedGems[index] && (
                                                        <div className="space-y-3 mt-3 animate-fadeIn">
                                                            {item.hiddenGems.map((gem, g) => (
                                                                <a 
                                                                    key={g} 
                                                                    href={getMapsUrl(gem.title, item.city)}
                                                                    target="_blank" 
                                                                    rel="noopener noreferrer"
                                                                    className="block bg-slate-900/40 p-3 rounded-lg border border-slate-800/50 hover:border-cyan-500/30 hover:bg-slate-800/60 transition-all group"
                                                                >
                                                                    <div className="flex items-start justify-between">
                                                                        <div className="text-sm font-bold text-cyan-200 mb-1 group-hover:text-cyan-100">{gem.title}</div>
                                                                        <MapPin size={14} className="text-slate-600 group-hover:text-cyan-400 shrink-0 mt-0.5" />
                                                                    </div>
                                                                    <div className="text-xs text-slate-400 leading-relaxed group-hover:text-slate-300">{gem.note}</div>
                                                                </a>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {/* Action Bar */}
                                            {item.links && item.links.length > 0 && (
                                                <div className="pt-4 border-t border-slate-800 flex flex-wrap gap-2">
                                                    {item.links.map((link, l) => (
                                                        <a 
                                                            key={l}
                                                            href={link.url}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg border border-slate-700 transition-colors"
                                                        >
                                                            {link.label.includes('Maps') ? <MapPin size={12}/> : <ExternalLink size={12}/>}
                                                            {link.label}
                                                        </a>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}

                        {/* End of Line */}
                        <div className="pl-12 pb-12">
                            <div className="p-6 rounded-2xl bg-gradient-to-br from-cyan-900/20 to-blue-900/20 border border-cyan-800/30 text-center">
                                <div className="text-4xl mb-2">🏠</div>
                                <h3 className="text-xl font-bold text-white mb-2">Heimreise</h3>
                                <p className="text-sm text-slate-400">
                                    Vollgepackt mit Erinnerungen zurück nach Europa. <br/>
                                    <span className="text-cyan-400">Du hast es geschafft!</span>
                                </p>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
