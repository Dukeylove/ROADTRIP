      { artist: "Kendrick Lamar", album: "Mr. Morale & The Big Steppers", year: 2022, cat: "2020er", link: "https://open.spotify.com/album/79ONNoS4M9tfIA1mYLBYVX", cover: "https://upload.wikimedia.org/wikipedia/en/9/9a/Kendrick_Lamar_-_Mr._Morale_%26_the_Big_Steppers.png", blurb: "Therapie-Rap, mutig & groß.", extra: { keyTracks: "N95; Father Time; Mother I Sober", why: "Emotion & Entwicklung – Drehbuchstruktur über zwei Akte." }, rating10: 8.5 },
      { artist: "Tyler, the Creator", album: "Call Me If You Get Lost", year: 2021, cat: "2020er", link: "https://open.spotify.com/album/45ba6QAtNrdv6Ke4MFOKk9", cover: "https://upload.wikimedia.org/wikipedia/en/4/40/Tyler%2C_the_Creator_-_Call_Me_If_You_Get_Lost.png", blurb: "Mixtape-Energie + Luxus-Ästhetik.", extra: { keyTracks: "WUSYANAME; CORSO; JUGGERNAUT", why: "Reise-Motiv im Album – passt perfekt zum Roadtrip." }, rating10: 8.8 },
      { artist: "Little Simz", album: "Sometimes I Might Be Introvert", year: 2021, cat: "2020er", link: "https://open.spotify.com/album/3zXjR3y2dUWklKmmp6lEhy", cover: "https://upload.wikimedia.org/wikipedia/en/1/17/Little_Simz_-_Sometimes_I_Might_Be_Introvert.png", blurb: "Orchestraler UK-Rap, filmisch.", extra: { keyTracks: "Introvert; Woman", why: "Große, cineastische Bögen – fokussiert beim Fahren." }, rating10: 9.1 },
      { artist: "JID", album: "The Forever Story", year: 2022, cat: "2020er", link: "https://open.spotify.com/album/5qM6z6GULmY9f0K1ZqAv6x", cover: "https://upload.wikimedia.org/wikipedia/en/4/4c/JID_-_The_Forever_Story.png", blurb: "Technik + Seele, sehr dynamisch.", extra: { keyTracks: "Dance Now; Surround Sound", why: "Abwechslung & Drive – null Müdigkeit." }, rating10: 8.7 },
      { artist: "JPEGMAFIA & Danny Brown", album: "SCARING THE HOES", year: 2023, cat: "2020er", link: "https://open.spotify.com/album/0Uo0EYCo8RgoQv1zQ58QF2", cover: "https://upload.wikimedia.org/wikipedia/en/1/1d/JPEGMAFIA_and_Danny_Brown_-_Scaring_the_Hoes.png", blurb: "Avant-Krach mit Humor – knallt.", extra: { keyTracks: "LEAN BEEF PATTY; SCARING THE HOES", why: "Wenn du Kante willst, um wach zu bleiben." }, rating10: 8.3 },
      // Deutschrap
      { artist: "Kool Savas", album: "King", year: 2014, cat: "Deutschrap", link: "https://open.spotify.com/album/6k4Rj0V2Yk9Yk3bUo2gE6S", cover: "https://upload.wikimedia.org/wikipedia/en/e/e7/Kool_Savas_-_King.jpg", blurb: "Technik-Benchmark.", extra: { keyTracks: "LMS 2012; Aura", why: "Wenn du Punchlines + Technik liebst." }, rating10: 8.2 },
      { artist: "K.I.Z", album: "Hurra die Welt geht unter", year: 2015, cat: "Deutschrap", link: "https://open.spotify.com/album/4oW3fO6Y5iXxk5UQn2cXQO", cover: "https://upload.wikimedia.org/wikipedia/en/0/03/K.I.Z._-_Hurra_die_Welt_geht_unter.jpg", blurb: "Satire, Hooks, Politik.", extra: { keyTracks: "Boom Boom Boom; Hurra die Welt…", why: "Für Tempo + Lachen zwischen den True-Crime-Brocken." }, rating10: 8.4 },
      { artist: "RIN", album: "Eros", year: 2017, cat: "Deutschrap", link: "https://open.spotify.com/album/6ImQ9mA4o1rZgR3xZC7R8U", cover: "https://upload.wikimedia.org/wikipedia/en/f/f6/RIN_-_Eros.jpg", blurb: "Melodischer Trap-Pop.", extra: { keyTracks: "Bros; Dior 2001", why: "Leichtfüßig für freie Autobahn – Kopfnicker." }, rating10: 7.9 },
      { artist: "Trettmann", album: "#DIY", year: 2017, cat: "Deutschrap", link: "https://open.spotify.com/album/0V6QOdE31E4n4t9n8WlKfN", cover: "https://upload.wikimedia.org/wikipedia/en/b/b5/Trettmann_-_DIY.jpg", blurb: "Cloud-Dancehall, eisig & elegant.", extra: { keyTracks: "Grauer Beton; Knöcheltief", why: "Nachtfahrt-Atmosphäre – minimal & effektiv." }, rating10: 8.3 },
      { artist: "Shirin David", album: "Bitches brauchen Rap", year: 2021, cat: "Deutschrap", link: "https://open.spotify.com/album/0KqX0zR6M0zYlQ1w9yW3bS", cover: "https://upload.wikimedia.org/wikipedia/en/f/f5/Shirin_David_-_Bitches_brauchen_Rap.png", blurb: "Pop-Rap auf Premium-Level.", extra: { keyTracks: "Lieben wir; Ich darf das", why: "Hook-Maschine – hält die Stimmung hoch." }, rating10: 7.8 },
    ];

    // =============================================================
    // UI Helpers
    // =============================================================
    function Tag({ active, children, onClick }) {
      return (
        <button
          onClick={onClick}
          className={
            "px-3 py-1 rounded-full border text-sm transition transform will-change-transform " +
            (active
              ? "bg-[#9ED2FF] text-black border-transparent scale-[1.02]"
              : "bg-white/5 text-white border-white/30 hover:border-white hover:bg-white/10 hover:scale-[1.02]")
          }
        >
          {children}
        </button>
      );
    }

    function StarBar({ value }) {
      const v = Math.max(0, Math.min(10, value ?? 0));
      return (
        <div className="flex items-center gap-1" aria-label={`Bewertung ${v}/10`}>
          {Array.from({ length: 10 }).map((_, i) => (
            <div key={i} className={`h-2 w-5 rounded ${i < Math.round(v) ? 'bg-[#9ED2FF]' : 'bg-white/10'}`} />
          ))}
          <span className="ml-2 text-xs" style={{ color: theme.sub }}>{v ? v.toFixed(1) + ' / 10' : '—'}</span>
        </div>
      );
    }

    function Cover({ src, title }) {
      if (!src) {
        return (
          <div className="relative h-44 w-full overflow-hidden bg-gradient-to-br from-[#1e293b] to-[#0b1220] flex items-end">
            <div className="p-3 text-white/80 text-sm line-clamp-2">{title}</div>
          </div>
        );
      }
      return (
        <div className="relative h-44 w-full overflow-hidden">
          <img src={src} alt="cover" className="h-full w-full object-cover transition-transform duration-300 group-hover:scale-[1.06]" />
          <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-black/0 to-black/0" />
        </div>
      );
    }

    function Card({ id, title, meta, right, blurb, link, rating, details, cover, onToggle, open }) {
      const isOpen = open === id;
      return (
        <div
          onClick={() => onToggle(id)}
          className="group relative rounded-2xl border border-white/10 bg-[rgba(15,23,42,0.9)] p-0 shadow-sm hover:shadow-2xl hover:border-[#9ED2FF] transition cursor-pointer overflow-hidden"
        >
          <Cover src={cover} title={title} />
          <div className="p-5">
            <div className="flex items-start justify-between gap-4">
              <div>
                <h3 className="text-lg font-semibold leading-tight text-white group-hover:text-[#9ED2FF] transition">{title}</h3>
                <p className="text-sm" style={{ color: theme.sub }}>{meta}</p>
              </div>
              {right && <div className="text-xs" style={{ color: theme.accent }}>{right}</div>}
            </div>
            {blurb && <p className="mt-3 text-[15px] leading-relaxed" style={{ color: theme.text }}>{blurb}</p>}
            <div className="mt-3"><StarBar value={rating} /></div>
            <div className={`mt-4 overflow-hidden transition-[max-height] duration-300 ${isOpen ? 'max-h-[520px]' : 'max-h-0'}`}>
              {details && (
                <div className="rounded-t-xl border border-white/10 bg-black/30 p-4 text-sm" style={{ color: theme.text }}>
                  {details.release && <p><span style={{ color: theme.accent }}>Release:</span> {details.release}</p>}
                  {details.producers && <p><span style={{ color: theme.accent }}>Produktion:</span> {details.producers}</p>}
                  {details.keyTracks && <p><span style={{ color: theme.accent }}>Key Tracks:</span> {details.keyTracks}</p>}
                  {details.awards && <p><span style={{ color: theme.accent }}>Awards:</span> {details.awards}</p>}
                  {details.why && <p className="mt-2 italic">Warum für dich: {details.why}</p>}
                  <a href={link} target="_blank" rel="noreferrer noopener" className="mt-3 inline-flex items-center gap-2 rounded-full border border-white/10 bg-[#9ED2FF] text-black px-3 py-1 text-xs hover:brightness-110">
                    Auf Spotify öffnen
                  </a>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =============================================================
    // Main Component
    // =============================================================
    function DukeysRoadtrip() {
      const [tab, setTab] = useState("podcasts"); // 'podcasts' | 'alben'
      const [q, setQ] = useState("");
      const [filters, setFilters] = useState([]);
      const [open, setOpen] = useState(null);

      // runtime "tests"
      useEffect(() => {
        PODCASTS.forEach((p, i) => {
          console.assert(!!p.title && !!p.publisher && !!p.year && !!p.link, `PODCASTS[${i}] missing required fields`);
          console.assert(p.rating10 === undefined || (p.rating10 >= 0 && p.rating10 <= 10), `PODCASTS[${i}] rating out of range`);
        });
        ALBUMS.forEach((a, i) => {
          console.assert(!!a.artist && !!a.album && !!a.year && !!a.link, `ALBUMS[${i}] missing required fields`);
          console.assert(a.rating10 === undefined || (a.rating10 >= 0 && a.rating10 <= 10), `ALBUMS[${i}] rating out of range`);
        });
        const pTitles = new Set();
        PODCASTS.forEach(p => { const k = p.title.toLowerCase(); console.assert(!pTitles.has(k), `Duplicate podcast title: ${p.title}`); pTitles.add(k); });
        const aKeys = new Set();
        ALBUMS.forEach(a => { const k = `${a.artist.toLowerCase()}__${a.album.toLowerCase()}`; console.assert(!aKeys.has(k), `Duplicate album: ${a.artist} - ${a.album}`); aKeys.add(k); });
      }, []);

      const podcastTags = ["DE", "EN", "< 6 h", "6–9 h", "> 9 h", "Neu (2024/25)"];
      const albumTags = ["90er (US)", "2000er", "2010er", "2020er", "Deutschrap"];

      const podcasts = useMemo(() => PODCASTS.map(p => ({
        ...p,
        bucket: p.length.includes("3") || p.length.includes("4") || p.length.includes("5") ? "< 6 h" : (p.length.includes("10") || p.length.includes("12")) ? "> 9 h" : "6–9 h",
        fresh: p.year >= 2024 ? "Neu (2024/25)" : "Alt/klassisch",
      })), []);

      const albums = useMemo(() => ALBUMS, []);

      const list = useMemo(() => {
        const text = q.trim().toLowerCase();
        if (tab === "podcasts") {
          return podcasts.filter(p => {
            const hit =
              p.title.toLowerCase().includes(text) ||
              p.publisher.toLowerCase().includes(text) ||
              (p.blurb || "").toLowerCase().includes(text);
            const tagOk = filters.length === 0 || filters.every(f => [p.lang, p.bucket, p.fresh].includes(f));
            return hit && tagOk;
          });
        } else {
          return albums.filter(a => {
            const hit =
              a.artist.toLowerCase().includes(text) ||
              a.album.toLowerCase().includes(text) ||
              (a.blurb || "").toLowerCase().includes(text);
            const tagOk = filters.length === 0 || filters.includes(a.cat);
            return hit && tagOk;
          });
        }
      }, [q, filters, tab, podcasts, albums]);

      const toggleFilter = (tag) => setFilters(prev => prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]);

      return (
        <div className="min-h-screen" style={{ background: `radial-gradient(1200px 600px at 20% -10%, #14213D 0%, ${theme.bg} 40%)` }}>
          {/* Header */}
          <header className="sticky top-0 z-10 backdrop-blur bg-black/40 border-b border-white/10">
            <div className="mx-auto max-w-6xl px-4 py-4 flex items-center justify-between">
              <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Dukey’s Roadtrip</h1>
              <nav className="flex gap-2">
                <button
                  className={`px-3 py-1 rounded-full text-sm border ${tab === 'podcasts' ? 'bg-white text-black border-white' : 'bg-transparent text-white border-white/40 hover:border-white'}`}
                  onClick={() => { setTab('podcasts'); setFilters([]); setQ(""); setOpen(null); }}
                >Podcasts</button>
                <button
                  className={`px-3 py-1 rounded-full text-sm border ${tab === 'alben' ? 'bg-white text-black border-white' : 'bg-transparent text-white border-white/40 hover:border-white'}`}
                  onClick={() => { setTab('alben'); setFilters([]); setQ(""); setOpen(null); }}
                >Alben</button>
              </nav>
            </div>
          </header>

          {/* Controls + Content */}
          <main className="mx-auto max-w-6xl px-4 py-8 text-white">
            <section className="mb-8">
              <div className="grid gap-3 sm:grid-cols-[1fr_auto] items-center">
                <input
                  value={q}
                  onChange={e => setQ(e.target.value)}
                  placeholder={tab === 'podcasts' ? 'Suche nach Titel, Publisher, Schlagwort…' : 'Suche nach Artist, Album, Stichwort…'}
                  className="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[15px] outline-none focus:border-white/40 placeholder:text-white/50"
                />
                <div className="text-sm text-white/60">{list.length} Ergebnisse</div>
              </div>
              <div className="mt-4 flex flex-wrap gap-2">
                {(tab === 'podcasts' ? podcastTags : albumTags).map(tag => (
                  <Tag key={tag} active={filters.includes(tag)} onClick={() => toggleFilter(tag)}>{tag}</Tag>
                ))}
                {filters.length > 0 && (
                  <button className="ml-2 text-sm underline" onClick={() => setFilters([])}>Filter zurücksetzen</button>
                )}
              </div>
            </section>

            {tab === 'alben' ? (
              <section className="space-y-8">
                {albumTags.map(group => (
                  <div key={group}>
                    <h2 className="mb-3 text-lg font-semibold text-white/90">{group}</h2>
                    <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                      {list.filter(a => a.cat === group).map(a => (
                        <Card
                          key={`${a.artist}-${a.album}`}
                          id={`${a.artist}-${a.album}`}
                          title={`${a.artist} — ${a.album}`}
                          meta={`${a.cat} · ${a.year}${a.length ? ` · ${a.length}` : ''}`}
                          right={a.rating10 ? `${a.rating10.toFixed(1)}/10` : ''}
                          blurb={a.blurb}
                          link={a.link}
                          rating={a.rating10}
                          details={a.extra}
                          cover={a.cover}
                          onToggle={(id) => setOpen(prev => prev === id ? null : id)}
                          open={open}
                        />
                      ))}
                    </div>
                  </div>
                ))}
              </section>
            ) : (
              <section className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                {list.map((p) => (
                  <Card
                    key={p.title}
                    id={p.title}
                    title={p.title}
                    meta={`${p.publisher} · ${p.episodes} Folgen · ${p.length} · ${p.lang}`}
                    right={`${p.year}`}
                    blurb={p.blurb}
                    link={p.link}
                    rating={p.rating10}
                    details={p.extra}
                    cover={p.cover}
                    onToggle={(id) => setOpen(prev => prev === id ? null : id)}
                    open={open}
                  />
                ))}
              </section>
            )}

            {/* Notes */}
            <section className="mt-10 rounded-2xl border border-white/10 bg-white/5 p-5">
              <h2 className="text-base font-semibold">Hinweise</h2>
              <ul className="mt-2 text-[15px] space-y-1 list-disc pl-5 text-white/80">
                <li>Karte klicken → Details (Release/Produktion/Key Tracks/Awards/Warum für dich).</li>
                <li>Bewertungen im 10-Punkte-System. Mischung aus Kritiker-Scores & kuratiertem Urteil.</li>
                <li>Design: hoher Kontrast, Baby-Blau (#9ED2FF), Hover-Glow + Zoom.</li>
              </ul>
            </section>
          </main>

          {/* Footer */}
          <footer className="mx-auto max-w-6xl px-4 py-10 text-sm text-white/60">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <p>Dukey’s Roadtrip – kuratierte Podcasts & Alben für lange Fahrten.</p>
              <p>© {new Date().getFullYear()} Dukey’s Roadtrip</p>
            </div>
          </footer>
        </div>
      );
    }

    // Mount
    ReactDOM.createRoot(document.getElementById('root')).render(<DukeysRoadtrip />);
  </script>
</body>
</html>
